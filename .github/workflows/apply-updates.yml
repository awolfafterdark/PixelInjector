name: Apply Custom Fingerprint Icon & Snowfall Updates

on:
  workflow_dispatch:
    inputs:
      run_verification:
        description: "Run ktlintCheck, unit tests, and assembleDebug before committing"
        required: false
        default: true
        type: boolean
      remove_workflow_after_apply:
        description: "Delete this workflow file (.github/workflows/apply-updates.yml) in the commit"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  apply-updates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Write all updated and newly created files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p \
            app/src/main/kotlin/eu/hxreborn/pixelinjector/prefs \
            app/src/main/kotlin/eu/hxreborn/pixelinjector/snow \
            app/src/main/kotlin/eu/hxreborn/pixelinjector/xposed/hook/systemui \
            app/src/main/kotlin/eu/hxreborn/pixelinjector/ui/component \
            app/src/main/kotlin/eu/hxreborn/pixelinjector/ui/editor \
            app/src/main/kotlin/eu/hxreborn/pixelinjector/ui/dashboard \
            app/src/main/kotlin/eu/hxreborn/pixelinjector/ui/navigation \
            app/src/main/kotlin/eu/hxreborn/pixelinjector/ui/viewmodel \
            app/src/main/res/values \
            app/src/main/res/values-in-rID

