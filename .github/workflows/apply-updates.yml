      - name: Set up JDK 21
        if: ${{ inputs.run_verification }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Format, check, test, and build debug APK
        if: ${{ inputs.run_verification }}
        run: ./gradlew :app:ktlintFormat :app:ktlintCheck :app:testDebugUnitTest :app:assembleDebug

      - name: Upload compiled debug APK
        if: ${{ inputs.run_verification }}
        uses: actions/upload-artifact@v4
        with:
          name: pixelinjector-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore

      - name: Commit and push updated files to repository
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ inputs.remove_workflow_after_apply }}" = "true" ] && [ -f ".github/workflows/apply-updates.yml" ]; then
            git rm -f .github/workflows/apply-updates.yml || rm -f .github/workflows/apply-updates.yml
          fi
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "${GITHUB_ACTOR}"
          git config user.email "${GITHUB_ACTOR_ID}+${GITHUB_ACTOR}@users.noreply.github.com"
          git commit -m "feat(systemui): add custom fingerprint icon options and dynamic snowfall tweak"
          git push origin "HEAD:${GITHUB_REF_NAME}"
